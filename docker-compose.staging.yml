services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.staging
    environment:
      PORT: 3001
      CORS_ORIGIN: https://v2estaging.rgbindia.com
      TZ: Asia/Kolkata
    ports:
      - "4301:3001"
    restart: unless-stopped
    networks:
      - v2e_staging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: https://v2estaging.rgbindia.com
    environment:
      BACKEND_URL: http://backend:3001
      TZ: Asia/Kolkata
    ports:
      - "3301:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - v2e_staging

networks:
  v2e_staging:
    driver: bridge
