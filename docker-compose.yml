services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.production
    environment:
      PORT: 3001
      CORS_ORIGIN: https://v2e.rgbindia.com
    ports:
      - "4300:3001"
    restart: unless-stopped
    networks:
      - v2e_prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_WS_URL: https://v2e.rgbindia.com
    environment:
      BACKEND_URL: http://backend:3001
    ports:
      - "3300:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - v2e_prod

networks:
  v2e_prod:
    driver: bridge
